<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Transporte Beilus C.A.</title>
    <meta
      name="description"
      content="Contáctanos para solicitar cotizaciones o información sobre nuestros servicios de transporte y logística."
    />
    <link rel="icon" type="image/png" href="../img/favicon-32x32.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header class="bg-primary text-white">
      <nav class="navbar navbar-expand-lg navbar-dark container">
        <a class="navbar-brand" href="../index.html">
          <img
            src="../img/logo.png"
            alt="Logo Transporte Beilus"
            class="logo-navbar"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="../index.html" class="nav-link">Inicio</a>
            </li>
            <li class="nav-item">
              <a href="servicios.html" class="nav-link">Servicios</a>
            </li>
            <li class="nav-item">
              <a href="tarifas.html" class="nav-link">Tarifas</a>
            </li>
            <li class="nav-item">
              <a href="rastreo.html" class="nav-link">Rastreo</a>
            </li>
            <li class="nav-item">
              <a href="contacto.html" class="nav-link active">Contacto</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container my-5 fade-in">
      <h1 class="fw-bold text-center mb-4">Contáctanos</h1>
      <form class="mx-auto" style="max-width: 600px">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            placeholder="Tu nombre"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="ejemplo@mail.com"
            required
          />
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea
            class="form-control"
            id="mensaje"
            rows="4"
            placeholder="Escribe tu mensaje aquí"
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Enviar mensaje
        </button>
      </form>
    </main>

    <footer>
      <p>© 2025 Transporte Beilus C.A. - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
