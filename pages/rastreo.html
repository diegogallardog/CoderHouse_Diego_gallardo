<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastreo | Transporte Beilus C.A.</title>
    <meta
      name="description"
      content="Rastrea tu envío con Transporte Beilus C.A. Ingresa tu número de guía y conoce el estado actual de tu carga."
    />
    <link rel="icon" type="image/png" href="../img/favicon-32x32.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header class="bg-primary text-white">
      <nav class="navbar navbar-expand-lg navbar-dark container">
        <a class="navbar-brand" href="../index.html">
          <img
            src="../img/logo.png"
            alt="Logo Transporte Beilus"
            class="logo-navbar"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="../index.html" class="nav-link">Inicio</a>
            </li>
            <li class="nav-item">
              <a href="servicios.html" class="nav-link">Servicios</a>
            </li>
            <li class="nav-item">
              <a href="tarifas.html" class="nav-link">Tarifas</a>
            </li>
            <li class="nav-item">
              <a href="rastreo.html" class="nav-link active">Rastreo</a>
            </li>
            <li class="nav-item">
              <a href="contacto.html" class="nav-link">Contacto</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container my-5 fade-in text-center">
      <h1 class="fw-bold mb-4">Rastreo de Envíos</h1>
      <p>Introduce tu número de guía para conocer el estado de tu envío.</p>
      <form class="my-4">
        <input
          type="text"
          class="form-control w-50 mx-auto mb-3"
          placeholder="Número de guía"
          required
        />
        <button type="submit" class="btn btn-primary">Rastrear</button>
      </form>
    </main>

    <footer>
      <p>© 2025 Transporte Beilus C.A. - Todos los derechos reservados</p>
